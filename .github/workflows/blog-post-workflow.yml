name: Latest blog post workflow
on:
  schedule:
    # Runs every day at 05:30 UTC
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pull in blog posts
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://0xsl4m.dev/index.xml"
          max_post_count: 5
          committer_username: 0xsl4m
          committer_email: 99960278+0xsl4m@users.noreply.github.com
          commit_message: "Update latest blog posts"
